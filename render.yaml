services:
  - type: web
    name: ira-property-management
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
    disk:
      name: excel-data
      mountPath: /app/data
      sizeGB: 1
